name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: evidence
    attributes:
      label: How would KernelVet verify it?
      description: Which tool output or execution would prove the result? (KernelVet never reports what it cannot observe.)
