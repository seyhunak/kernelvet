[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kernelvet"
dynamic = ["version"]
description = "Unofficial open-source diagnostics and CUDA-to-HIP migration toolkit for AMD GPUs. Not affiliated with AMD."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "KernelVet contributors" }]
keywords = ["rocm", "hip", "amd", "gpu", "cuda", "hipify", "diagnostics", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Hardware",
]
dependencies = [
  "typer>=0.12",
  "textual>=0.80",
  "rich>=13.7",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "jsonschema>=4.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
kernelvet = "kernelvet.main:main"

[project.urls]
Homepage = "https://github.com/seyhunak/kernelvet"
Issues = "https://github.com/seyhunak/kernelvet/issues"
Changelog = "https://github.com/seyhunak/kernelvet/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kernelvet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kernelvet"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "docs", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "gpu: requires a real AMD GPU with ROCm (skipped automatically when absent)",
  "hipify: requires hipify-perl or hipify-clang on PATH",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: `ruff format` owns line length. RUF001: en dashes in help text are intentional.
# B008: Typer declares options as call defaults.
ignore = ["S603", "S607", "RUF012", "S101", "E501", "RUF001", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
packages = ["kernelvet"]
mypy_path = "src"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
